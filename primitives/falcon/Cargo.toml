[package]
name = "argonaut-primitives-falcon"
version = "0.1.0"
edition = "2021"
license = "Unlicense"
description = "Falcon-512 signature types and host-function interface for Argonaut"

[dependencies]
parity-scale-codec = { workspace = true }
scale-info = { workspace = true }
sp-core = { workspace = true }
sp-runtime = { workspace = true }
sp-runtime-interface = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
blake3 = { workspace = true }
fn-dsa-vrfy = { workspace = true, optional = true }

[dev-dependencies]
fn-dsa = { workspace = true }
rand_core = "0.6"
rand_chacha = "0.3"

[features]
default = ["std"]
std = [
    "parity-scale-codec/std",
    "scale-info/std",
    "sp-core/std",
    "sp-runtime/std",
    "sp-runtime-interface/std",
    "fn-dsa-vrfy",
    "blake3/std",
]
# Dev-only escape hatch (sr25519 bootstrap signing, e.g. `//Alice`-style dev
# accounts). Deliberately independent of `std`/`default` -- see the doc
# comment on `ArgonautSignature::Sr25519`. `runtime/build.rs`'s
# `WasmBuilder` runs the wasm build as a fully separate `--no-default-
# features` cargo invocation with no explicit feature-forwarding, so this
# feature reaches the wasm blob only if `runtime/Cargo.toml`'s own
# `dev-signatures` feature is threaded there explicitly -- it isn't, by
# design (see runtime/Cargo.toml). Native crates (node tooling, chain specs,
# benchmarking) opt in directly.
dev-signatures = []
