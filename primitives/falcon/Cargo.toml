[package]
name = "argonaut-primitives-falcon"
version = "0.1.0"
edition = "2021"
license = "Unlicense"
description = "Falcon-512 signature types and host-function interface for Argonaut"

[dependencies]
parity-scale-codec = { workspace = true }
scale-info = { workspace = true }
sp-core = { workspace = true }
sp-runtime-interface = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
blake3 = { workspace = true }
fn-dsa-vrfy = { workspace = true, optional = true }

[features]
default = ["std"]
std = [
    "parity-scale-codec/std",
    "scale-info/std",
    "sp-core/std",
    "fn-dsa-vrfy",
    "blake3/std",
]
