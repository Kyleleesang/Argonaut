[package]
name = "argonaut-primitives-storage"
version = "0.1.0"
edition = "2021"
license = "Unlicense"
description = "Storage-platform (Implementation D) shared types, selection formulas, and the BaoProof host function"

[dependencies]
parity-scale-codec = { workspace = true }
scale-info = { workspace = true }
sp-core = { workspace = true }
sp-runtime-interface = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
blake3 = { workspace = true }
# Native-only: the `BaoProof` host-function BODY uses bao-tree for slice
# verification. Same gating discipline as `fn-dsa-vrfy` in primitives/falcon:
# optional, enabled by `std`, referenced only inside the `#[runtime_interface]`
# native body (which the macro cfg-gates to std / never reaches the wasm blob).
bao-tree = { workspace = true, optional = true }

[features]
default = ["std"]
std = [
    "parity-scale-codec/std",
    "scale-info/std",
    "sp-core/std",
    "sp-runtime-interface/std",
    "blake3/std",
    "bao-tree",
]
