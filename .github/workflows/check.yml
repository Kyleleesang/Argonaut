name: Check Set-Up & Build

# Phase 0 acceptance criterion (docs/ARGONAUT_ARCHITECTURE_GUIDE.md §1.2): this workflow must
# actually run (trigger on Base, where all work happens -- this repo never
# touches main) and must actually build the wasm32-unknown-unknown runtime
# rather than skip it, so a broken runtime build fails CI instead of silently
# passing. Rewritten 2026-07-15: the previous version triggered on main only
# (so it never ran), set SKIP_WASM_BUILD=1 (skipping the one build it claimed
# to check), and predated dev-signatures and every crate added since Phase 0.
on:
  push:
    branches: [ Base ]
  pull_request:
    branches: [ Base ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential clang libclang-dev protobuf-compiler pkg-config libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - uses: Swatinem/rust-cache@v2

      # Full release build, no SKIP_WASM_BUILD: this is what actually forces
      # substrate-wasm-builder to compile argonaut-runtime for
      # wasm32-unknown-unknown, not just check the native side.
      - name: Build (release, node binary + wasm runtime)
        run: cargo build --release --workspace

      # Dedicated check so a wasm-specific regression (e.g. the toolchain-skew
      # "undefined symbol" class of failure found while building B-10's Docker
      # image, docs/IMPLEMENTATION_AB_FIXPLAN.md) is attributable to this step
      # by name, not buried in a generic build failure.
      - name: Verify wasm32-unknown-unknown runtime artifact exists
        run: test -f target/release/wbuild/argonaut-runtime/argonaut_runtime.compact.compressed.wasm

      - name: Test
        run: cargo test --workspace

      - name: Build for benchmarking
        run: cargo check -p argonaut-node --features=runtime-benchmarks --release
