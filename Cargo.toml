[workspace]
resolver = "2"
members = [
    "node",
    "runtime",
    "primitives/falcon",
    "primitives/prism",
    "primitives/agg",
    "primitives/storage",
    "pallets/falcon-registry",
    "pallets/agg-verify",
    "pallets/provider-registry",
    "pallets/storage-deals",
    "pallets/storage-proofs",
    "pallets/payment-channels",
    "client/prism-db",
    "client/prism-chain",
    "client/prism-miner",
    "client/prism-network",
    "client/prism-ledger",
    "client/aggregator",
    "client/argonaut-store",
    "wallet/signer-core",
    "wallet/signer-wasm",
]

[profile.release]
panic = "unwind"

[workspace.dependencies]
# polkadot-sdk stable2412 — pin ONE release for all workspace crates (§1.2 rule 3).
# Upgrade only at phase boundaries; never mix with polkadot-v0.9.29 in the same link unit.
sp-core = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
sp-std = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
sp-io = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
frame-support = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
frame-system = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
parity-scale-codec = { version = "3.7", default-features = false, features = ["derive"] }
scale-info = { version = "2.11", default-features = false, features = ["derive"] }
blake3 = { version = "1.5", default-features = false }
# Implementation D (storage): bao-tree slice verification (native host-fn body
# only) + Reed-Solomon erasure coding (client-side encode/decode). iroh pins are
# added later at the D3 daemon milestone (see docs/IMPLEMENTATION_D_SPEC.md D.15).
bao-tree = { version = "0.16", default-features = false }
reed-solomon-simd = "3"
fn-dsa = { version = "0.2", default-features = false }
fn-dsa-sign = { version = "0.2", default-features = false }
fn-dsa-vrfy = { version = "0.2", default-features = false }
rocksdb = { version = "0.21", default-features = false }
thiserror = "1"
arc-swap = "1"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
