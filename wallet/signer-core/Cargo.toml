[package]
name = "argonaut-signer-core"
version = "0.1.0"
edition = "2021"
license = "Unlicense"
description = "Falcon-512 keystore, address derivation, and transaction signing — shared by the node CLI and the browser signer"

[dependencies]
fn-dsa = { workspace = true }
blake3 = { workspace = true, features = ["std"] }
blake2 = "0.10"
bs58 = "0.5"
chacha20poly1305 = "0.10"
hex = { version = "0.4", features = ["serde"] }
parity-scale-codec = { workspace = true, features = ["std"] }
rand_core = "0.6"
serde = { workspace = true }

[dev-dependencies]
# Byte-compat pinning only: the library itself must stay Substrate-free so it
# compiles for wasm32-unknown-unknown (the browser signer).
argonaut-primitives-falcon = { path = "../../primitives/falcon" }
sp-core = { workspace = true, features = ["std"] }
sp-runtime = { workspace = true, features = ["std"] }
rand_chacha = "0.3"
serde_json = { workspace = true }
