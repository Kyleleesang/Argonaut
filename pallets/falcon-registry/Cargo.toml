[package]
name = "pallet-falcon-registry"
version = "0.1.0"
edition = "2021"
license = "Unlicense"
description = "On-chain Falcon-512 public-key registry — enables registry-mode txs"

[dependencies]
parity-scale-codec = { workspace = true }
scale-info = { workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
sp-core = { workspace = true }
sp-runtime = { workspace = true }
sp-std = { workspace = true }
argonaut-primitives-falcon = { path = "../../primitives/falcon", default-features = false }
frame-benchmarking = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false, optional = true }

[dev-dependencies]
sp-io = { workspace = true, features = ["std"] }
pallet-balances = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }

[features]
default = ["std"]
std = [
    "parity-scale-codec/std",
    "scale-info/std",
    "frame-support/std",
    "frame-system/std",
    "sp-core/std",
    "sp-runtime/std",
    "sp-std/std",
    "argonaut-primitives-falcon/std",
    "frame-benchmarking?/std",
]
runtime-benchmarks = [
    "frame-benchmarking/runtime-benchmarks",
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
]
