[package]
name = "pallet-payment-channels"
version = "0.1.0"
edition = "2021"
license = "Unlicense"
description = "Implementation D: unidirectional Falcon-signed micropayment channels for retrieval"

[dependencies]
parity-scale-codec = { workspace = true }
scale-info = { workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
sp-core = { workspace = true }
sp-runtime = { workspace = true }
sp-std = { workspace = true }
argonaut-primitives-storage = { path = "../../primitives/storage", default-features = false }
argonaut-primitives-falcon = { path = "../../primitives/falcon", default-features = false }
pallet-falcon-registry = { path = "../falcon-registry", default-features = false }
frame-benchmarking = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false, optional = true }

[dev-dependencies]
sp-io = { workspace = true, features = ["std"] }
pallet-balances = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }
# Real Falcon signatures in tests (voucher settle path).
fn-dsa = { workspace = true }
rand_core = "0.6"
rand_chacha = "0.3"

[features]
default = ["std"]
std = [
    "parity-scale-codec/std",
    "scale-info/std",
    "frame-support/std",
    "frame-system/std",
    "sp-core/std",
    "sp-runtime/std",
    "sp-std/std",
    "argonaut-primitives-storage/std",
    "argonaut-primitives-falcon/std",
    "pallet-falcon-registry/std",
    "frame-benchmarking?/std",
]
runtime-benchmarks = [
    "frame-benchmarking/runtime-benchmarks",
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
]
