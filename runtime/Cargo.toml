[package]
name = "argonaut-runtime"
version = "0.1.0"
edition = "2021"
license = "Unlicense"
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
parity-scale-codec = { workspace = true, features = ["derive"] }
scale-info = { workspace = true, features = ["derive"] }

# polkadot-sdk stable2412 — same branch as all other workspace crates
frame-executive        = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
frame-support          = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
frame-system           = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
frame-try-runtime      = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false, optional = true }
frame-system-benchmarking      = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false, optional = true }
frame-benchmarking             = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false, optional = true }
frame-system-rpc-runtime-api   = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }

pallet-balances        = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
pallet-insecure-randomness-collective-flip = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
pallet-sudo            = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
pallet-timestamp       = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
pallet-transaction-payment     = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
pallet-transaction-payment-rpc-runtime-api = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
pallet-falcon-registry = { path = "../pallets/falcon-registry", default-features = false }
pallet-provider-registry = { path = "../pallets/provider-registry", default-features = false }
pallet-storage-deals   = { path = "../pallets/storage-deals", default-features = false }
pallet-storage-proofs  = { path = "../pallets/storage-proofs", default-features = false }
pallet-payment-channels = { path = "../pallets/payment-channels", default-features = false }
argonaut-primitives-falcon = { path = "../primitives/falcon", default-features = false }
argonaut-primitives-storage = { path = "../primitives/storage", default-features = false }

sp-api             = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
sp-block-builder   = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
sp-core            = { workspace = true }
sp-genesis-builder = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
sp-inherents       = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
sp-offchain        = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
sp-runtime         = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
sp-session         = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
sp-std             = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
sp-transaction-pool = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
sp-version         = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }

hex-literal = { version = "0.4", optional = true }

[dev-dependencies]
fn-dsa = { workspace = true }
rand_core = "0.6"
rand_chacha = "0.3"
sp-io = { workspace = true, features = ["std"] }

[build-dependencies]
substrate-wasm-builder = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }

[features]
default = ["std"]
std = [
    "parity-scale-codec/std",
    "scale-info/std",
    "frame-executive/std",
    "frame-support/std",
    "frame-system/std",
    "frame-system-rpc-runtime-api/std",
    "frame-try-runtime/std",
    "pallet-balances/std",
    "pallet-insecure-randomness-collective-flip/std",
    "pallet-sudo/std",
    "pallet-timestamp/std",
    "pallet-transaction-payment/std",
    "pallet-transaction-payment-rpc-runtime-api/std",
    "pallet-falcon-registry/std",
    "pallet-provider-registry/std",
    "pallet-storage-deals/std",
    "pallet-storage-proofs/std",
    "pallet-payment-channels/std",
    "argonaut-primitives-falcon/std",
    "argonaut-primitives-storage/std",
    "sp-api/std",
    "sp-block-builder/std",
    "sp-core/std",
    "sp-genesis-builder/std",
    "sp-inherents/std",
    "sp-offchain/std",
    "sp-runtime/std",
    "sp-session/std",
    "sp-std/std",
    "sp-transaction-pool/std",
    "sp-version/std",
]
runtime-benchmarks = [
    "frame-benchmarking/runtime-benchmarks",
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
    "frame-system-benchmarking/runtime-benchmarks",
    "pallet-balances/runtime-benchmarks",
    "pallet-timestamp/runtime-benchmarks",
    "pallet-falcon-registry/runtime-benchmarks",
    "sp-runtime/runtime-benchmarks",
    "hex-literal",
]
try-runtime = [
    "frame-try-runtime",
    "frame-executive/try-runtime",
    "frame-system/try-runtime",
    "frame-support/try-runtime",
    "pallet-insecure-randomness-collective-flip/try-runtime",
    "pallet-sudo/try-runtime",
    "pallet-timestamp/try-runtime",
    "pallet-transaction-payment/try-runtime",
]
# Dev-only sr25519 signature support (see `ArgonautSignature::Sr25519`'s doc
# comment). Deliberately NOT part of `std`/`default`/anything the wasm build
# enables: `runtime/build.rs`'s `WasmBuilder` runs the wasm target as an
# isolated `--no-default-features` cargo invocation with no explicit feature
# forwarding, so this feature never reaches the wasm blob unless a future
# change to `build.rs` explicitly threads it through -- don't do that; a
# production runtime should not accept non-post-quantum signatures. Native
# crates that need dev accounts (`node`, its chain specs, benchmarking, CLI
# tooling) enable this directly against their own native compilation of this
# crate, which never touches the wasm build.
dev-signatures = ["argonaut-primitives-falcon/dev-signatures"]
