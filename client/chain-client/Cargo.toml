[package]
name = "argonaut-chain-client"
version = "0.1.0"
edition = "2021"
license = "Unlicense"
description = "Thin native-only RPC client shared by the D3 provider daemon and CLI (Implementation D §D.11): submits ArgonautSignature-signed extrinsics, reads storage, subscribes to finalized heads."

[lib]
name = "argonaut_chain_client"
path = "src/lib.rs"

[dependencies]
argonaut-runtime = { path = "../../runtime" }
argonaut-primitives-falcon = { path = "../../primitives/falcon" }
argonaut-primitives-storage = { path = "../../primitives/storage" }
argonaut-signer-core = { path = "../../wallet/signer-core" }
pallet-payment-channels = { path = "../../pallets/payment-channels" }

sp-core = { workspace = true, features = ["std"] }
sp-core-hashing = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }
frame-support = { workspace = true, features = ["std"] }
frame-system = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }
pallet-transaction-payment = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }
parity-scale-codec = { workspace = true, features = ["std"] }

jsonrpsee = { workspace = true }
tokio = { workspace = true }
futures = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
hex = "0.4"
thiserror = { workspace = true }
rand_core = "0.6"

[dev-dependencies]
rand_chacha = "0.3"
